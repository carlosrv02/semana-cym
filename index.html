<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestra semana</title>
<meta name="theme-color" content="#1f2433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f9; --panel:#ffffff; --panel2:#f8f9fc; --ink:#1b1e27; --muted:#6b7183;
  --line:#dfe2ea; --line2:#eef0f5; --accent:#5b6cff; --accent-ink:#fff; --danger:#e5484d;
  --ok:#2f9e6f; --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.06);
  --rh:24px; --colw:104px; --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141b; --panel:#1b1e28; --panel2:#222634; --ink:#e8eaf2; --muted:#9aa0b4;
    --line:#2e3242; --line2:#242837; --accent:#7b88ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
@media (pointer:coarse){ :root{ --rh:30px; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(#e07a5f 0 25%,#4ea8de 0 50%,#5fb49c 0 75%,#9b8bd8 0)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--pc,#999);display:inline-block}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:14px 16px 40px;max-width:1500px;margin:0 auto}

/* ---------- comunes ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:1px solid var(--line);background:var(--panel);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.ib.sm{width:26px;height:26px;font-size:15px;border-radius:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.bar .grow{flex:1}
.weeknav{display:flex;align-items:center;gap:8px}
.wlabel{font-weight:700;min-width:190px;text-align:center}
.hint{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- paleta ---------- */
.palette{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;user-select:none}
.tool .sw{width:14px;height:14px;border-radius:4px;background:var(--c)}
.tool.on{outline:2.5px solid var(--accent);outline-offset:1px;font-weight:600}
.palette .sep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* ---------- rejilla del horario ---------- */
.grid-wrap{overflow:auto;max-height:calc(100dvh - 230px);min-height:320px;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:50px repeat(var(--n),minmax(var(--colw),1fr));min-width:max-content;position:relative}
.grid.both{--colw:70px}
.gh{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);
  padding:7px 4px;text-align:center;font-size:13px;cursor:pointer;user-select:none;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gh.corner{left:0;z-index:7;cursor:default;border-left:0}
.gh.today b{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:999px}
.gh .pn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.grid.both .gh.first,.grid.both .col.first{border-left:2px solid var(--line)}
.times{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
.t{height:var(--rh);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;position:relative}
.t span{position:relative;top:-7px}
.col{position:relative;height:calc(var(--rows) * var(--rh));border-left:1px solid var(--line2);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(2*var(--rh) - 1px),var(--line) calc(2*var(--rh) - 1px),var(--line) calc(2*var(--rh))),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rh) - 1px),var(--line2) calc(var(--rh) - 1px),var(--line2) var(--rh));
  cursor:pointer}
.col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.grid.paint .col{touch-action:none;cursor:crosshair}
.blk{position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 6px;font-size:12px;line-height:1.2;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .r{font-size:10.5px;opacity:.8;white-space:nowrap}
.grid.both .blk{font-size:11px;padding:2px 4px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ---------- resumen ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.summary .panel{padding:14px}
.summary h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.srow{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.srow .nm{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .trk{height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.srow .fill{height:100%;border-radius:99px}
.srow .h{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- tablero ---------- */
.board-sec{margin-bottom:22px}
.board-sec h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;align-items:flex-start}
.bcol{flex:0 0 272px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.bhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:2px 2px 4px}
.bhead .cnt{color:var(--muted);font-weight:500;background:var(--panel2);border-radius:99px;padding:0 8px;font-size:12px}
.bhead .ib{margin-left:auto}
.sdot{width:10px;height:10px;border-radius:50%}
.st-nueva{background:#8b93a7}.st-pendiente{background:#e9a23b}.st-curso{background:#4ea8de}.st-bloqueada{background:#e5484d}.st-hecha{background:#2f9e6f}.st-archivada{background:#b4b8c5}
.cards{display:flex;flex-direction:column;gap:8px;min-height:46px;border-radius:10px}
.bcol.over .cards{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;border-left:4px solid var(--sc,transparent)}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.3}
.card .ct{font-weight:600;font-size:14px;word-break:break-word}
.card.done .ct{text-decoration:line-through;color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);align-items:center}
.prog{width:56px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block}
.prog i{display:block;height:100%;background:var(--ok)}
.due{padding:1px 7px;border-radius:99px;background:var(--line2)}
.due.late{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:13px;color:transparent;padding:0;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ph{height:44px;border:2px dashed var(--accent);border-radius:11px;opacity:.6}
.ghost{position:fixed;z-index:100;pointer-events:none;width:250px;transform:rotate(2.5deg);box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:.95}
.addline{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:7px;color:var(--muted);text-align:left}

/* ---------- ajustes ---------- */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.settings .panel{padding:16px}
.settings h3{margin:0 0 4px;font-size:16px}
.settings p{margin:4px 0 12px;color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap}
.row label{min-width:110px;color:var(--muted);font-size:13.5px}
input[type=text],input[type=date],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input[type=text]{flex:1}
input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel2)}
textarea{width:100%;min-height:70px;resize:vertical}
.catrow{display:grid;grid-template-columns:38px 1fr 54px 34px;gap:8px;align-items:center;margin:6px 0}
.catrow .h{font-size:12px;color:var(--muted);text-align:right}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.sheet{background:var(--panel);border-radius:18px;max-width:540px;width:100%;max-height:92dvh;overflow:auto;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.sheet .fld{margin:12px 0}
.sheet .fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet .foot .left{margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dtog{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 10px;min-width:48px}
.dtog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dtog:disabled{opacity:1}
.cl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:5px 0}
.cl input[type=checkbox]{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

@media (max-width:640px){
  .top{padding:8px 12px}
  main{padding:10px 12px 30px}
  .wlabel{min-width:0}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:94dvh}
  .grid-wrap{max-height:calc(100dvh - 260px)}
  .srow{grid-template-columns:100px 1fr 42px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>Nuestra semana</div>
  <div class="seg" id="profileSeg"></div>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="horario">Horario</button>
    <button data-act="tab" data-tab="objetivos">Objetivos</button>
    <button data-act="tab" data-tab="ajustes">Ajustes</button>
  </nav>
</header>
<main>
  <section id="view-horario"></section>
  <section id="view-objetivos"></section>
  <section id="view-ajustes"></section>
</main>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" class="hidden">

<script src="firebase-config.js"></script>
<script>
'use strict';
/* =====================================================================
   Nuestra semana — horario semanal + objetivos tipo Trello
   Datos: localStorage de este dispositivo. Compartir: exportar/importar archivo.
   ===================================================================== */
const LS_DATA = 'nuestra-semana:data';
const LS_DEV  = 'nuestra-semana:device';
const DAYS   = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const STATUSES = [
  {id:'nueva',name:'Nuevas'},{id:'pendiente',name:'Pendientes'},{id:'curso',name:'En curso'},
  {id:'bloqueada',name:'Bloqueadas'},{id:'hecha',name:'Hechas'}
];
const ARCH = {id:'archivada',name:'Archivadas'};
const STCOL = {nueva:'#8b93a7',pendiente:'#e9a23b',curso:'#4ea8de',bloqueada:'#e5484d',hecha:'#2f9e6f',archivada:'#b4b8c5'};
let PIDS = ['a','b'];
/* ---------- modo nube (Firebase) ---------- */
const FB_CFG = window.FIREBASE_CONFIG;
const CLOUD = !!(FB_CFG && FB_CFG.apiKey && !/PEGA/i.test(FB_CFG.apiKey) && location.protocol.startsWith('http'));
let ME = null;                       // uid del usuario conectado
const canEdit = pid => !CLOUD || pid === ME;
const DEFAULT_CATS = [['Dormir','#6c7bd9'],['Trabajo','#e07a5f'],['Comida','#f2b05e'],['Cena','#e9a23b'],
  ['Gym','#5fb49c'],['Estudio','#9b8bd8'],['Leer','#4ea8de'],['Ocio','#f28cb1']];

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- fechas ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const fmtMin = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const hrs = n => (Math.round(n*10)/10).toString().replace('.',',') + ' h';

/* ---------- estado ---------- */
function emptyProfile(id, name, color){
  return {id, name, color, categories: DEFAULT_CATS.map(([n,c]) => ({id:uid(), name:n, color:c})),
          weeks:{}, cards:[], updatedAt: Date.now()};
}
function normalizeProfile(p, id){
  p = p || {};
  return {
    id, name: p.name || (id==='a'?'Persona 1':'Persona 2'), color: p.color || (id==='a'?'#e07a5f':'#4ea8de'),
    categories: Array.isArray(p.categories) ? p.categories.filter(c=>c && c.id).map(c=>({id:String(c.id), name:String(c.name||'Sin nombre'), color:c.color||'#9aa0b4'})) : [],
    weeks: (p.weeks && typeof p.weeks==='object') ? p.weeks : {},
    cards: Array.isArray(p.cards) ? p.cards.filter(c=>c && c.id).map(c=>({
      id:String(c.id), title:String(c.title||''), notes:String(c.notes||''), status:c.status||'nueva', prev:c.prev,
      due:c.due||'', created:c.created||Date.now(), updated:c.updated||Date.now(),
      checklist: Array.isArray(c.checklist) ? c.checklist.map(i=>({id:i.id||uid(), text:String(i.text||''), done:!!i.done})) : []
    })) : [],
    updatedAt: p.updatedAt || Date.now()
  };
}
function loadData(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_DATA));
    if (s && s.profiles) { PIDS.forEach(id => s.profiles[id] = normalizeProfile(s.profiles[id], id)); return s; }
  }catch(e){}
  return null;
}
function loadDev(){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem(LS_DEV)) || {}; }catch(e){}
  return Object.assign({setup:false, owner:'a', view:'a', tab:'horario', startH:6, endH:25, lastExport:0, showArchived:false}, d);
}
let S = CLOUD ? {app:'nuestra-semana', v:1, profiles:{}}
  : (loadData() || {app:'nuestra-semana', v:1, profiles:{a:emptyProfile('a','Persona 1','#e07a5f'), b:emptyProfile('b','Persona 2','#4ea8de')}});
let D = loadDev();
let curWeek = iso(mondayOf(new Date()));

function persist(){
  if (CLOUD){ scheduleSync(); return; }
  try{ localStorage.setItem(LS_DATA, JSON.stringify(S)); }
  catch(e){ toast('⚠️ No se pudo guardar: ' + e.message); }
}
function save(...pids){
  pids = pids.filter(canEdit);
  pids.forEach(p => { if (S.profiles[p]) S.profiles[p].updatedAt = Date.now(); });
  if (pids.length || !CLOUD) persist();
}
// Re-render diferido cuando llegan cambios de la nube mientras el usuario está haciendo algo
let pendingRender = false;
function busy(){
  const ae = document.activeElement;
  return !!(modalCtx || paint || (drag && drag.on) || (ae && /input|textarea|select/i.test(ae.tagName) && ae.closest('main')));
}
function scheduleRender(){ if (busy()) pendingRender = true; else { pendingRender = false; render(); } }
function flushRender(){ if (pendingRender && !busy()) { pendingRender = false; render(); } }
function saveDev(){ try{ localStorage.setItem(LS_DEV, JSON.stringify(D)); }catch(e){} }

const P = id => S.profiles[id];
const other = id => id==='a' ? 'b' : 'a';
const visible = () => D.view==='both' ? PIDS : [D.view];
const slots = () => { const a=[]; for (let m=D.startH*60; m<D.endH*60; m+=30) a.push(m); return a; };
function getWeek(pid, wk, create){
  let w = P(pid).weeks[wk];
  if (!w && create) w = P(pid).weeks[wk] = [{},{},{},{},{},{},{}];
  return w;
}
const weekHasData = w => !!w && w.some(d => d && Object.keys(d).length);
const catOf = (pid, cid) => P(pid).categories.find(c => c.id===cid);
function textOn(hex){
  const h = (hex||'#999').replace('#',''); if (h.length<6) return '#1b1e27';
  const [r,g,b] = [0,2,4].map(i => parseInt(h.substr(i,2),16)/255);
  return (0.299*r + 0.587*g + 0.114*b) > 0.62 ? '#1b1e27' : '#ffffff';
}

/* ---------- utilidades UI ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2600); }
let modalCtx = null;
function openModal(html, ctx={}){
  const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.remove('hidden'); modalCtx = ctx; ctx.mount && ctx.mount(m.firstElementChild);
  const f = m.querySelector('[autofocus]'); if (f && matchMedia('(pointer:fine)').matches) f.focus();
}
function closeModal(force){
  if (modalCtx && modalCtx.locked && !force) return;
  const m=$('#modal'); m.classList.add('hidden'); m.innerHTML=''; const c=modalCtx; modalCtx=null; c && c.onClose && c.onClose();
  setTimeout(flushRender, 0);
}
function confirmBox(title, msg, okLabel='Aceptar', danger=false){

/* =====================================================================
   HORARIO
   ===================================================================== */
let tool = 'select';           // 'select' | 'erase' | id de categoría
const undoStack = [];
function pushUndo(pids){
  undoStack.push(pids.map(p => ({p, wk:curWeek, data: P(p).weeks[curWeek] ? clone(P(p).weeks[curWeek]) : null})));
  if (undoStack.length > 40) undoStack.shift();
}
function undo(){
  const snap = undoStack.pop(); if (!snap) { toast('Nada que deshacer'); return; }
  snap.forEach(s => { if (s.data) P(s.p).weeks[s.wk] = s.data; else delete P(s.p).weeks[s.wk]; });
  save(...snap.map(s=>s.p)); curWeek = snap[0].wk; renderHorario(); toast('Deshecho');
}

function renderHorario(){
  const v = $('#view-horario');
  const old = $('#gridWrap'); const sc = old ? [old.scrollTop, old.scrollLeft] : null;
  const both = D.view==='both';
  const ro = !both && !canEdit(D.view);        // horario del otro: solo lectura
  const edPids = visible().filter(canEdit);
  if (both || ro || (tool!=='select' && tool!=='erase' && !catOf(D.view, tool))) tool = 'select';
  const mon = parseIso(curWeek), sun = addDays(mon, 6);
  const isThis = curWeek === iso(mondayOf(new Date()));
  let h = `<div class="bar">
    <div class="weeknav">
      <button class="ib" data-act="prevw" title="Semana anterior">‹</button>
      <div class="wlabel">${fmtDate(mon)} – ${fmtDate(sun)} ${sun.getFullYear()}${isThis?' · <span style="color:var(--accent)">esta semana</span>':''}</div>
      <button class="ib" data-act="nextw" title="Semana siguiente">›</button>
      ${isThis?'':'<button class="btn sm" data-act="today">Hoy</button>'}
    </div>
    <div class="grow"></div>
    ${edPids.length ? `<button class="btn sm" data-act="undo" ${undoStack.length?'':'disabled'}>↶ Deshacer</button>
    <button class="btn sm" data-act="copyprev">⧉ Copiar semana anterior</button>
    <button class="btn sm danger" data-act="clearweek">Vaciar semana</button>` : ''}
  </div>`;
  if (ro){
    h += `<div class="hint" style="margin-bottom:8px">👀 Estás viendo el horario de <b>${esc(P(D.view).name)}</b> (solo lectura; se actualiza solo).</div>`;
  } else if (!both){
    const cats = P(D.view).categories;
    h += `<div class="palette">
      <button class="tool ${tool==='select'?'on':''}" data-act="tool" data-tool="select">👆 Tocar</button>
      <button class="tool ${tool==='erase'?'on':''}" data-act="tool" data-tool="erase">🧽 Borrar</button>
      <span class="sep"></span>
      ${cats.map(c => `<button class="tool ${tool===c.id?'on':''}" data-act="tool" data-tool="${c.id}" style="--c:${c.color}"><span class="sw"></span>${esc(c.name)}</button>`).join('')}
      <button class="tool" data-act="addcat" title="Nueva actividad">＋ Nueva</button>
    </div>
    <div class="hint" style="margin:-4px 0 8px">${tool==='select'
      ? 'Toca un bloque para editarlo, moverlo o copiarlo a otros días. Toca un hueco para crear uno. Toca el nombre del día para copiar el día entero.'
      : tool==='erase' ? 'Arrastra sobre las horas para borrar.' : `Arrastra sobre las horas para pintar <b>${esc(catOf(D.view,tool).name)}</b>.`}</div>`;
  } else {
    h += `<div class="hint" style="margin-bottom:8px">Vista conjunta. Toca un bloque ${CLOUD?'tuyo ':''}para editarlo. Para pintar arrastrando, elige ${CLOUD?'tu nombre':'una sola persona'} arriba.</div>`;
  }
  h += `<div class="grid-wrap panel" id="gridWrap">${gridHtml()}</div><div class="summary" id="summary">${summaryHtml()}</div>`;
  v.innerHTML = h;
  const gw = $('#gridWrap');
  if (sc) { gw.scrollTop = sc[0]; gw.scrollLeft = sc[1]; }
  else {
    // primera vez: desplazar cerca de la hora actual
    const now = new Date(), m = now.getHours()*60 + now.getMinutes();
    const rh = gw.querySelector('.t')?.getBoundingClientRect().height || 24;
    gw.scrollTop = Math.max(0, ((m - D.startH*60)/30 - 3) * rh);
  }
}

function columns(){
  const cols = [];
  for (let d=0; d<7; d++) visible().forEach((p,i) => cols.push({day:d, p, first:i===0}));
  return cols;
}
function gridHtml(){
  const both = D.view==='both', sl = slots(), mon = parseIso(curWeek), today = iso(new Date());
  const cols = columns();
  let h = `<div class="grid ${both?'both':''} ${!both && tool!=='select'?'paint':''}" style="--n:${cols.length};--rows:${sl.length}">`;
  h += `<div class="gh corner"></div>`;
  cols.forEach(c => {
    const d = addDays(mon, c.day), isT = iso(d)===today;
    h += `<div class="gh ${isT?'today':''} ${c.first?'first':''}" data-act="dayhdr" data-day="${c.day}" data-p="${c.p}">
      ${!both || c.first ? `<b>${DAYS_S[c.day]} ${d.getDate()}</b>` : '<b>&nbsp;</b>'}
      ${both ? `<span class="pn"><span class="pdot" style="--pc:${P(c.p).color}"></span>${esc(P(c.p).name)}</span>` : ''}</div>`;
  });
  h += `<div class="times">${sl.map(m => `<div class="t">${m%60===0 && m!==sl[0] ? `<span>${fmtMin(m)}</span>` : (m===sl[0]?`<span style="top:0">${fmtMin(m)}</span>`:'')}</div>`).join('')}</div>`;
  cols.forEach(c => {
    const isT = iso(addDays(mon, c.day))===today;
    h += `<div class="col ${isT?'today':''} ${c.first?'first':''}" data-day="${c.day}" data-p="${c.p}">${blocksHtml(c.p, c.day, isT)}</div>`;
  });
  return h + `</div>`;
}
function runsOf(pid, day){
  const w = getWeek(pid, curWeek), sl = slots(), runs = [];
  const dd = w ? (w[day]||{}) : {};
  let i = 0;
  while (i < sl.length){
    const cid = dd[sl[i]];
    if (!cid){ i++; continue; }
    let j = i; while (j+1 < sl.length && dd[sl[j+1]]===cid) j++;
    runs.push({cid, i, len:j-i+1, from:sl[i], to:sl[j]+30});
    i = j+1;
  }
  return runs;
}
function blocksHtml(pid, day, isToday){
  let h = runsOf(pid, day).map(r => {
    const c = catOf(pid, r.cid) || {name:'¿?', color:'#9aa0b4'};
    return `<div class="blk" style="top:calc(${r.i}*var(--rh));height:calc(${r.len}*var(--rh) - 1px);background:${c.color};color:${textOn(c.color)}">
      <b>${esc(c.name)}</b>${r.len>=2?`<span class="r">${fmtMin(r.from)}–${fmtMin(r.to)}</span>`:''}</div>`;
  }).join('');
  if (isToday){
    const n = new Date(), m = n.getHours()*60 + n.getMinutes();
    if (m >= D.startH*60 && m < D.endH*60) h += `<div class="now" style="top:calc(${(m - D.startH*60)/30}*var(--rh))"></div>`;
  }
  return h;
}
function summaryHtml(){
  return visible().map(pid => {
    const w = getWeek(pid, curWeek), tot = {};
    if (w) w.forEach(d => Object.values(d||{}).forEach(cid => tot[cid] = (tot[cid]||0) + 0.5));
    const rows = Object.entries(tot).sort((a,b) => b[1]-a[1]);
    const max = rows.length ? rows[0][1] : 1, sum = rows.reduce((s,r)=>s+r[1],0);
    return `<div class="panel"><h3><span class="pdot" style="--pc:${P(pid).color}"></span>Horas de ${esc(P(pid).name)} esta semana
      <span class="hint" style="margin-left:auto;font-weight:400">${hrs(sum)} planificadas</span></h3>
      ${rows.length ? rows.map(([cid,v]) => { const c = catOf(pid,cid) || {name:'¿?',color:'#9aa0b4'};
        return `<div class="srow"><span class="nm"><span class="pdot" style="--pc:${c.color}"></span>${esc(c.name)}</span>
          <span class="trk"><span class="fill" style="display:block;width:${v/max*100}%;background:${c.color}"></span></span><span class="h">${hrs(v)}</span></div>`; }).join('')
        : '<div class="hint">Aún no hay nada en esta semana.</div>'}</div>`;
  }).join('');
}
function refreshCol(pid, day){
  const col = $(`#gridWrap .col[data-day="${day}"][data-p="${pid}"]`);
  if (col) col.innerHTML = blocksHtml(pid, day, col.classList.contains('today'));
}
function slotFromEvent(col, y){
  const r = col.getBoundingClientRect(), sl = slots();
  return clamp(Math.floor((y - r.top) / (r.height / sl.length)), 0, sl.length-1);
}

/* --- pintar arrastrando --- */
let paint = null;
document.addEventListener('pointerdown', e => {
  if (D.tab!=='horario' || D.view==='both' || tool==='select' || e.button>0) return;
  const col = e.target.closest('#gridWrap .col'); if (!col || !canEdit(col.dataset.p)) return;
  e.preventDefault();
  pushUndo([col.dataset.p]);
  paint = {p: col.dataset.p, last: null, id: e.pointerId};
  paintAt(e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => { if (paint && e.pointerId===paint.id) { e.preventDefault(); paintAt(e.clientX, e.clientY); } }, {passive:false});
const endPaint = e => { if (paint && e.pointerId===paint.id){ paint=null; save(D.view); $('#summary').innerHTML = summaryHtml(); const u=$('[data-act="undo"]'); if (u) u.disabled = false; flushRender(); } };
document.addEventListener('pointerup', endPaint);
document.addEventListener('pointercancel', endPaint);
function paintAt(x, y){
  const el = document.elementFromPoint(x, y); const col = el && el.closest('#gridWrap .col');
  if (!col || col.dataset.p !== paint.p) return;
  const day = +col.dataset.day, idx = slotFromEvent(col, y), sl = slots();
  const w = getWeek(paint.p, curWeek, true);
  const from = (paint.last && paint.last.day===day) ? Math.min(paint.last.idx, idx) : idx;
  const to   = (paint.last && paint.last.day===day) ? Math.max(paint.last.idx, idx) : idx;
  for (let k=from; k<=to; k++){ if (tool==='erase') delete w[day][sl[k]]; else w[day][sl[k]] = tool; }
  paint.last = {day, idx};
  refreshCol(paint.p, day);
}

/* --- editar un bloque (modo tocar) --- */
function openBlockModal(pid, day, idx){
  const sl = slots(), endMin = D.endH*60;
  const run = runsOf(pid, day).find(r => idx >= r.i && idx < r.i + r.len);
  const cats = P(pid).categories;
  if (!cats.length){ toast('Primero crea una actividad'); return; }
  const st = run ? {cid:run.cid, from:run.from, to:run.to} : {cid:(tool!=='select'&&tool!=='erase'?tool:cats[0].id), from:sl[idx], to:Math.min(sl[idx]+60, endMin)};
  const days = new Set([day]);
  const d = addDays(parseIso(curWeek), day);
  const draw = sheet => {
    $('.chips.cats', sheet).innerHTML = cats.map(c => `<button class="tool ${st.cid===c.id?'on':''}" data-m="cat" data-id="${c.id}" style="--c:${c.color}"><span class="sw"></span>${esc(c.name)}</button>`).join('');
    $('#bFrom', sheet).innerHTML = sl.map(m => `<option value="${m}" ${m===st.from?'selected':''}>${fmtMin(m)}</option>`).join('');
    $('#bTo', sheet).innerHTML = sl.map(m=>m+30).filter(m => m > st.from).map(m => `<option value="${m}" ${m===st.to?'selected':''}>${fmtMin(m)}</option>`).join('');
    $('.chips.days', sheet).innerHTML = DAYS_S.map((n,i) => `<button class="dtog ${days.has(i)?'on':''}" data-m="day" data-i="${i}" ${i===day?'disabled':''}>${n}</button>`).join('');
  };
  openModal(`<h2>${run ? 'Editar bloque' : 'Nuevo bloque'}</h2>
    <div class="sub">${DAYS[day]} ${fmtDate(d)} · ${esc(P(pid).name)}</div>
    <div class="fld"><label>Actividad</label><div class="chips cats"></div></div>
    <div class="fld"><label>Horario</label><div class="row" style="margin:0"><select id="bFrom"></select> → <select id="bTo"></select></div></div>
    <div class="fld"><label>Aplicar también a estos días</label><div class="chips days"></div></div>
    <div class="foot">${run?'<button class="btn danger left" data-m="del">Eliminar</button>':''}
      <button class="btn" data-m="cancel">Cancelar</button><button class="btn pri" data-m="ok">Guardar</button></div>`, {
    mount(sheet){
      draw(sheet);
      $('#bFrom', sheet).onchange = e => { st.from = +e.target.value; if (st.to <= st.from) st.to = Math.min(st.from+60, endMin); draw(sheet); };
      $('#bTo', sheet).onchange = e => { st.to = +e.target.value; };
    },
    actions:{
      cat(el){ st.cid = el.dataset.id; draw($('.sheet')); },
      day(el){ const i=+el.dataset.i; days.has(i)?days.delete(i):days.add(i); draw($('.sheet')); },
      cancel(){ closeModal(); },
      del(){ pushUndo([pid]); const w=getWeek(pid,curWeek,true); for (let m=run.from; m<run.to; m+=30) if (w[day][m]===run.cid) delete w[day][m];
             save(pid); closeModal(); renderHorario(); },
      ok(){
        pushUndo([pid]); const w = getWeek(pid, curWeek, true);
        if (run) for (let m=run.from; m<run.to; m+=30) if (w[day][m]===run.cid) delete w[day][m];
        days.forEach(dd => { for (let m=st.from; m<st.to; m+=30) w[dd][m] = st.cid; });
        save(pid); closeModal(); renderHorario();
        if (days.size>1) toast(`Aplicado a ${days.size} días`);
      }
    }
  });
}
function openDayModal(pid, day){

async function copyPrevWeek(){
  const pids = visible().filter(canEdit); let done = 0;
  const any = pids.some(p => weekHasData(getWeek(p, curWeek)));
  if (any && !await confirmBox('Copiar semana anterior', 'Esta semana ya tiene bloques. Se <b>reemplazarán</b> por los de la última semana que tenga datos.', 'Reemplazar')) return;
  pushUndo(pids);
  pids.forEach(p => {
    const prev = Object.keys(P(p).weeks).filter(k => k < curWeek && weekHasData(P(p).weeks[k])).sort().pop();
    if (prev){ P(p).weeks[curWeek] = clone(P(p).weeks[prev]); done++; }
  });
  if (!done){ undoStack.pop(); toast('No hay ninguna semana anterior con datos'); return; }
  save(...pids); renderHorario(); toast('Semana copiada');
}
async function clearWeek(){
  const pids = visible().filter(canEdit);
  if (!await confirmBox('Vaciar semana', `Se borrarán todos los bloques de esta semana${pids.length>1?' de los dos':''}${CLOUD&&D.view==='both'?' (solo los tuyos)':''}. Puedes deshacerlo con ↶.`, 'Vaciar', true)) return;
  pushUndo(pids); pids.forEach(p => delete P(p).weeks[curWeek]); save(...pids); renderHorario();
}

    <div class="row"><input type="color" id="cColor" value="${st.color}"><input type="text" id="cName" placeholder="Ej.: Correr, Inglés, Comida…" value="${esc(st.name)}" autofocus></div>

function cardHtml(c){
  const tot = c.checklist.length, dn = c.checklist.filter(i=>i.done).length;
  const late = c.due && c.status!=='hecha' && c.status!=='archivada' && c.due < iso(new Date());
  const done = c.status==='hecha' || c.status==='archivada';
  return `<div class="card ${done?'done':''}" data-id="${c.id}" style="--sc:${STCOL[c.status]||'transparent'}">
    <button class="chk ${done?'on':''}" data-act="togglecard" title="${done?'Desmarcar':'Marcar como hecha'}">✓</button>
    <div><div class="ct">${esc(c.title)}</div>
    ${(tot||c.due||c.notes)?`<div class="meta">
      ${tot?`<span class="prog"><i style="width:${dn/tot*100}%"></i></span>${dn}/${tot}`:''}
      ${c.due?`<span class="due ${late?'late':''}">📅 ${fmtDate(parseIso(c.due))}</span>`:''}
      ${c.notes?'<span title="Tiene notas">📝</span>':''}</div>`:''}</div></div>`;
}
const findCard = (pid, id) => P(pid).cards.find(c => c.id===id);
function toggleCard(pid, id){
  const c = findCard(pid, id); if (!c) return;
  if (c.status==='hecha' || c.status==='archivada'){ c.status = (c.prev && c.prev!=='hecha') ? c.prev : 'pendiente'; }
  else { c.prev = c.status; c.status = 'hecha'; c.checklist.forEach(i => i.done = true); }
  c.updated = Date.now(); save(pid); renderBoard();

let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (D.tab!=='objetivos' || e.button>0) return;
  const card = e.target.closest('.card'); if (!card || e.target.closest('.chk')) return;
  const col = card.closest('.bcol'); if (!canEdit(col.dataset.p)) return;
  drag = {card, pid:col.dataset.p, id:card.dataset.id, x0:e.clientX, y0:e.clientY, pid0:e.pointerId, touch:e.pointerType!=='mouse', on:false, timer:null};
  if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.on) startDrag(drag.x0, drag.y0); }, 280);
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId!==drag.pid0) return;
  const dist = Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0);
  if (!drag.on){
    if (drag.touch){ if (dist > 10){ clearTimeout(drag.timer); drag = null; } return; }  // era un scroll
    if (dist > 6) startDrag(e.clientX, e.clientY); else return;
  }
  e.preventDefault(); moveDrag(e.clientX, e.clientY);
}, {passive:false});
document.addEventListener('touchmove', e => { if (drag && drag.on) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });
function startDrag(x, y){
  drag.on = true;
  const r = drag.card.getBoundingClientRect();
  drag.dx = x - r.left; drag.dy = y - r.top;
  drag.ghost = drag.card.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.style.width = r.width+'px';
  document.body.appendChild(drag.ghost);
  drag.ph = document.createElement('div'); drag.ph.className = 'ph'; drag.ph.style.height = r.height+'px';
  drag.card.after(drag.ph); drag.card.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(15);
  moveDrag(x, y);
}
function moveDrag(x, y){
  drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
  const el = document.elementFromPoint(x, y); const col = el && el.closest('.bcol');
  $$('.bcol.over').forEach(c => c !== col && c.classList.remove('over'));
  const board = drag.card.closest('.board');
  if (board){ const br = board.getBoundingClientRect();
    if (x < br.left + 50) board.scrollLeft -= 14; else if (x > br.right - 50) board.scrollLeft += 14; }
  if (!col || col.dataset.p !== drag.pid) return;
  col.classList.add('over');
  const list = $('.cards', col);
  const after = [...list.querySelectorAll('.card:not(.dragging)')].find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height/2; });
  if (after) list.insertBefore(drag.ph, after); else list.appendChild(drag.ph);
  drag.target = {st: col.dataset.st, before: after ? after.dataset.id : null};
}
function endDrag(e){
  if (!drag || (e && e.pointerId!==drag.pid0)) return;
  clearTimeout(drag.timer);
  if (drag.on){
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    drag.ghost.remove();
    if (drag.target && e && e.type==='pointerup'){
      const cards = P(drag.pid).cards, i = cards.findIndex(c => c.id===drag.id);
      const [c] = cards.splice(i, 1);
      if (c.status!==drag.target.st){ if (drag.target.st==='hecha') c.prev = c.status; c.status = drag.target.st; c.updated = Date.now(); }
      const bi = drag.target.before ? cards.findIndex(x => x.id===drag.target.before) : -1;
      if (bi >= 0) cards.splice(bi, 0, c);
      else { let last = -1; cards.forEach((x,k) => { if (x.status===c.status) last = k; }); cards.splice(last+1, 0, c); }
      save(drag.pid);
    }
    drag = null; pendingRender = false; renderBoard(); return;
  }
  drag = null;
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* --- exportar / importar --- */
function exportObj(pids){
  const o = {app:'nuestra-semana', v:1, exportedAt:Date.now(), from:D.owner, profiles:{}};
  pids.forEach(p => o.profiles[p] = P(p)); return o;
}
const slug = s => s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'datos';
function download(text, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function sendMine(){
  const p = D.owner, text = JSON.stringify(exportObj([p]));
  const base = `semana-${slug(P(p).name)}-${iso(new Date())}`;
  // Android solo deja compartir ciertos tipos (no .json), por eso .txt
  const file = new File([text], base + '.txt', {type:'text/plain'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:`Horario de ${P(p).name}`}); D.lastExport = Date.now(); saveDev(); renderSettings(); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  download(text, base + '.json'); D.lastExport = Date.now(); saveDev(); renderSettings(); toast('Archivo descargado');
}
function exportAll(){ download(JSON.stringify(exportObj(PIDS), null, 1), `semana-copia-completa-${iso(new Date())}.json`); D.lastExport = Date.now(); saveDev(); render(); toast('Copia descargada'); }

  const ids = PIDS.filter(id => data.profiles[id]);

  if (!D.setup){ ids.forEach(id => S.profiles[id] = normalizeProfile(data.profiles[id], id)); persist(); toast('Datos importados'); afterImport && afterImport(); return; }

  openModal(`<h2>Importar datos</h2><div class="sub">Archivo «${esc(f.name)}», creado el ${when}.</div><div id="impList"></div>

document.addEventListener('click', e => {
  const m = e.target.closest('[data-m]');
  if (m && modalCtx && modalCtx.actions && modalCtx.actions[m.dataset.m]){ modalCtx.actions[m.dataset.m](m); return; }
  if (suppressClick) return;
  const a = e.target.closest('[data-act]');
  if (a){
    const ds = a.dataset;
    switch (ds.act){
      case 'tab': D.tab = ds.tab; saveDev(); render(); window.scrollTo(0,0); return;
      case 'view': D.view = ds.v; tool = 'select'; saveDev(); render(); return;
      case 'prevw': curWeek = iso(addDays(parseIso(curWeek), -7)); renderHorario(); return;
      case 'nextw': curWeek = iso(addDays(parseIso(curWeek), 7)); renderHorario(); return;
      case 'today': curWeek = iso(mondayOf(new Date())); renderHorario(); return;
      case 'undo': undo(); return;
      case 'copyprev': copyPrevWeek(); return;
      case 'clearweek': clearWeek(); return;
      case 'tool': tool = ds.tool; renderHorario(); return;
      case 'addcat': openCatModal(ds.p || (D.view==='both' ? D.owner : D.view)); return;
      case 'dayhdr': if (canEdit(ds.p)) openDayModal(ds.p, +ds.day); return;
      case 'addcard': openCardModal(ds.p, null, ds.st); return;
      case 'togglecard': { const c = a.closest('.card'), pid = c.closest('.bcol').dataset.p;
        if (!canEdit(pid)) { toast(`Las tareas de ${P(pid).name} solo se pueden ver`); return; }
        toggleCard(pid, c.dataset.id); return; }
      case 'logout': cloudLogout(); return;
      case 'archive': { const pid = ds.p; P(pid).cards.forEach(c => { if (c.status==='hecha') c.status = 'archivada'; }); save(pid); renderBoard(); toast('Archivadas'); return; }
      case 'owner': D.owner = ds.v; saveDev(); renderSettings(); return;
      case 'sendmine': sendMine(); return;
      case 'exportall': exportAll(); return;
      case 'import': $('#fileIn').click(); return;
      case 'install': installEvt && installEvt.prompt(); installEvt = null; return;
      case 'delcat': deleteCat(ds.p, ds.id); return;
      case 'wipe': (async () => {
        if (!await confirmBox('Borrar todo', 'Se borrarán <b>todos</b> los datos de este dispositivo. Haz antes una copia si la quieres. No se puede deshacer.', 'Borrar todo', true)) return;
        localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_DEV); location.reload(); })(); return;
    }
  }
  // tocar la rejilla
  if (D.tab==='horario' && (tool==='select' || D.view==='both')){
    const col = e.target.closest('#gridWrap .col');
    if (col && canEdit(col.dataset.p)) openBlockModal(col.dataset.p, +col.dataset.day, slotFromEvent(col, e.clientY));
  }
  if (D.tab==='objetivos'){
    const card = e.target.closest('.card');
    if (card){ const pid = card.closest('.bcol').dataset.p;
      if (canEdit(pid)) openCardModal(pid, card.dataset.id); else openCardView(pid, card.dataset.id); }
  }
});
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset; if (!ds.chg) return;
  switch (ds.chg){
    case 'pname': P(ds.p).name = t.value.trim() || P(ds.p).name; save(ds.p); render(); break;
    case 'pcolor': P(ds.p).color = t.value; save(ds.p); render(); break;
    case 'catname': { const c = catOf(ds.p, ds.id); if (c && t.value.trim()){ c.name = t.value.trim(); save(ds.p); } break; }
    case 'catcolor': { const c = catOf(ds.p, ds.id); if (c){ c.color = t.value; save(ds.p); } break; }
    case 'starth': D.startH = +t.value; saveDev(); break;
    case 'endh': D.endH = +t.value; saveDev(); break;
    case 'showarch': D.showArchived = t.checked; saveDev(); renderBoard(); break;
  }
});
// Al volver a la app (p. ej. tras horas), refrescar la línea de "ahora"
document.addEventListener('visibilitychange', () => { if (!document.hidden && D.tab==='horario' && !modalCtx && !paint) renderHorario(); });
setInterval(() => { if (D.tab==='horario' && !modalCtx && !paint && !document.hidden) $$('#gridWrap .col.today').forEach(c => refreshCol(c.dataset.p, +c.dataset.day)); }, 60000);

/* =====================================================================
   NUBE (Firebase Auth + Firestore)
   Estructura:  spaces/{uid}              → {name, color, categories, cards, updatedAt}
                spaces/{uid}/weeks/{lunes} → {days:[{ "360":"idCategoria", ... } x7]}
   ===================================================================== */
const FB_VER = '10.14.1';
let fb = null, cloudEmail = '', syncTimer = null, synced = {main:null, weeks:{}};
const weekUnsubs = {};
let spacesUnsub = null;

async function startCloud(){
  showLoading('Conectando…');
  try{
    const base = window.FIREBASE_SDK_BASE || `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    const app = appM.initializeApp(FB_CFG);
    let db;
    try{ db = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
    catch(e){ db = fsM.getFirestore(app); }
    const auth = authM.getAuth(app);
    fb = {auth, db, ...authM, ...fsM};
    authM.onAuthStateChanged(auth, user => { if (user) enterCloud(user); else showLogin(); });
  }catch(e){
    console.error(e);
    showLoading('No se pudo conectar. Revisa la conexión a internet y vuelve a abrir la app.<br><br><button class="btn pri" onclick="location.reload()">Reintentar</button>');
  }
}
function showLoading(msg){
  openModal(`<h2>Nuestra semana</h2><div class="sub" style="margin:10px 0 4px">${msg}</div>`, {locked:true});
}
function showLogin(){
  let mode = 'login';
  const draw = s => {
    $('#lgBody', s).innerHTML = `
      ${mode==='signup'?`<div class="fld"><label>Tu nombre</label><input type="text" id="lgName" style="width:100%" placeholder="Ej.: Carlos" autocomplete="nickname"></div>`:''}
      <div class="fld"><label>Email</label><input type="text" id="lgEmail" style="width:100%" inputmode="email" autocomplete="email" autocapitalize="off"></div>
      <div class="fld"><label>Contraseña</label><input type="password" id="lgPass" style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="${mode==='signup'?'Mínimo 6 caracteres':''}"></div>
      <div id="lgErr" style="color:var(--danger);font-size:13.5px;min-height:18px"></div>
      <div class="foot" style="justify-content:space-between">
        <button class="btn" data-m="toggle">${mode==='login'?'Crear cuenta nueva':'Ya tengo cuenta'}</button>
        <button class="btn pri" data-m="go">${mode==='login'?'Entrar':'Crear cuenta'}</button></div>
      ${mode==='login'?'<div style="text-align:right;margin-top:8px"><button class="btn sm" style="border:0;color:var(--muted)" data-m="reset">¿Has olvidado la contraseña?</button></div>':''}`;
    $$('input', s).forEach(i => i.addEventListener('keydown', e => { if (e.key==='Enter') modalCtx.actions.go(); }));
  };
  const err = m => { const el = $('#lgErr'); if (el) el.textContent = m; };
  const msg = e => ({
    'auth/invalid-email':'El email no es válido.', 'auth/invalid-credential':'Email o contraseña incorrectos.',
    'auth/wrong-password':'Contraseña incorrecta.', 'auth/user-not-found':'No existe ninguna cuenta con ese email.',
    'auth/email-already-in-use':'Ya hay una cuenta con ese email. Pulsa «Ya tengo cuenta».',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.', 'auth/too-many-requests':'Demasiados intentos. Espera un poco.',
    'auth/network-request-failed':'Sin conexión a internet.', 'auth/operation-not-allowed':'El registro de cuentas nuevas está desactivado.',
    'auth/admin-restricted-operation':'El registro de cuentas nuevas está desactivado.'
  }[e.code] || e.message);
  openModal(`<h2>👋 Nuestra semana</h2><div class="sub">Entra con tu cuenta. Cada uno tiene la suya.</div><div id="lgBody"></div>`, {
    locked:true, mount: draw,
    actions:{
      toggle(){ mode = mode==='login' ? 'signup' : 'login'; draw($('.sheet')); },
      async reset(){ const em = $('#lgEmail').value.trim(); if (!em){ err('Escribe tu email arriba y vuelve a pulsar.'); return; }
        try{ await fb.sendPasswordResetEmail(fb.auth, em); err(''); toast('Te hemos enviado un email para cambiar la contraseña'); }catch(e){ err(msg(e)); } },
      async go(){
        const em = $('#lgEmail').value.trim(), pw = $('#lgPass').value;
        if (!em || !pw){ err('Rellena email y contraseña.'); return; }
        const btn = $('[data-m="go"]'); btn.disabled = true; err('');
        try{
          if (mode==='login') await fb.signInWithEmailAndPassword(fb.auth, em, pw);
          else {
            const name = ($('#lgName').value || '').trim() || em.split('@')[0];
            sessionStorage.setItem('ns-newname', name);
            await fb.createUserWithEmailAndPassword(fb.auth, em, pw);
          }
        }catch(e){ err(msg(e)); btn.disabled = false; }
      }
    }
  });
}
async function enterCloud(user){
  ME = user.uid; cloudEmail = user.email || ''; D.owner = ME;
  if (!PIDS.includes(D.view) && D.view!=='both') D.view = ME;
  showLoading('Cargando vuestros datos…');
  const {doc, getDoc, setDoc, collection, onSnapshot} = fb;
  try{
    const ref = doc(fb.db, 'spaces', ME);
    const snap = await getDoc(ref);
    if (!snap.exists()){
      const nm = sessionStorage.getItem('ns-newname') || cloudEmail.split('@')[0];
      const p = emptyProfile(ME, nm, ['#e07a5f','#4ea8de','#5fb49c','#9b8bd8'][Math.floor(Math.random()*4)]);
      await setDoc(ref, {name:p.name, color:p.color, categories:p.categories, cards:[], updatedAt:Date.now()});
    }
    sessionStorage.removeItem('ns-newname');
  }catch(e){
    console.error(e);
    showLoading(e.code==='permission-denied'
      ? `Tu cuenta (<b>${esc(cloudEmail)}</b>) no tiene permiso. Revisa que tu email esté en las reglas de Firestore (mira el LEEME).<br><br><button class="btn" data-m="out">Cerrar sesión</button>`
      : 'No se pudieron cargar los datos: ' + esc(e.message));
    modalCtx.actions = {out(){ cloudLogout(); }};
    return;
  }
  let first = true;
  spacesUnsub = onSnapshot(collection(fb.db, 'spaces'), qs => {
    qs.forEach(d => {
      const id = d.id;
      if (!weekUnsubs[id]) weekUnsubs[id] = onSnapshot(collection(fb.db, 'spaces', id, 'weeks'), ws => {
        if (id===ME && S.profiles[ME] && (syncTimer || ws.metadata.hasPendingWrites)) return;
        const weeks = {};
        ws.forEach(w => { const days = w.data().days; if (Array.isArray(days) && days.length===7) weeks[w.id] = days.map(x => x||{}); });
        if (!S.profiles[id]) return;
        S.profiles[id].weeks = weeks;
        if (id===ME){ synced.weeks = {}; Object.entries(weeks).forEach(([k,v]) => synced.weeks[k] = JSON.stringify(v)); }
        scheduleRender();
      }, e => console.error(e));
      // no pisar cambios locales que aún no se han subido
      if (id===ME && S.profiles[ME] && (syncTimer || d.metadata.hasPendingWrites)) return;
      const data = d.data(), cur = S.profiles[id];
      S.profiles[id] = normalizeProfile({...data, weeks: cur ? cur.weeks : {}}, id);
      if (id===ME) synced.main = JSON.stringify(mainOf(S.profiles[id]));
    });
    const others = qs.docs.map(d => d.id).filter(id => id!==ME).sort();
    PIDS = [ME, ...others].slice(0, 2);
    if (first){ first = false; closeModal(true); render(); } else scheduleRender();
  }, e => { console.error(e); toast('⚠️ Error de sincronización: ' + e.message); });
}
const mainOf = p => ({name:p.name, color:p.color, categories:p.categories, cards:p.cards});
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(flushSync, 500); }
function flushSync(){
  clearTimeout(syncTimer); syncTimer = null;
  if (!fb || !ME || !S.profiles[ME]) return;
  const p = S.profiles[ME], {doc, setDoc, deleteDoc} = fb;
  const fail = e => { console.error(e); toast('⚠️ No se pudo guardar en la nube: ' + e.message); };
  const mj = JSON.stringify(mainOf(p));
  if (mj !== synced.main){ synced.main = mj; setDoc(doc(fb.db, 'spaces', ME), {...JSON.parse(mj), updatedAt: Date.now()}).catch(fail); }
  Object.entries(p.weeks).forEach(([wk, days]) => {
    const j = JSON.stringify(days);
    if (synced.weeks[wk] !== j){ synced.weeks[wk] = j; setDoc(doc(fb.db, 'spaces', ME, 'weeks', wk), {days: JSON.parse(j)}).catch(fail); }
  });
  Object.keys(synced.weeks).forEach(wk => { if (!p.weeks[wk]){ delete synced.weeks[wk]; deleteDoc(doc(fb.db, 'spaces', ME, 'weeks', wk)).catch(fail); } });
}
async function cloudLogout(){
  if (syncTimer) flushSync();
  try{ await fb.signOut(fb.auth); }catch(e){}
  location.reload();
}
function cloudImport(data, fname){
  const ids = Object.keys(data.profiles); if (!ids.length){ toast('El archivo no contiene datos'); return; }
  let sel = ids.find(id => (data.profiles[id].name||'').toLowerCase()===P(ME).name.toLowerCase()) || ids[0];
  const draw = s => { $('#impList', s).innerHTML = ids.map(id => `<button class="dtog ${sel===id?'on':''}" data-m="pick" data-id="${id}" style="margin:3px">${esc(data.profiles[id].name||id)}</button>`).join(''); };
  openModal(`<h2>Cargar en mi espacio</h2><div class="sub">Archivo «${esc(fname)}». ¿Qué datos del archivo son los tuyos?</div>
    <div id="impList" class="chips"></div>
    <p class="hint">Se reemplazarán tus actividades, horarios y objetivos actuales por los del archivo. Tu nombre se mantiene.</p>
    <div class="foot"><button class="btn" data-m="cancel">Cancelar</button><button class="btn pri" data-m="ok">Cargar</button></div>`, {
    mount: draw,
    actions:{ pick(el){ sel = el.dataset.id; draw($('.sheet')); }, cancel(){ closeModal(); },
      ok(){ const np = normalizeProfile(data.profiles[sel], ME);
        Object.assign(P(ME), {color:np.color, categories:np.categories, weeks:np.weeks, cards:np.cards});
        save(ME); closeModal(); render(); toast('Datos cargados en tu espacio'); } }
  });
}
window.addEventListener('pagehide', () => { if (syncTimer) flushSync(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && syncTimer) flushSync(); });
window.addEventListener('online', () => { if (D.tab==='ajustes') scheduleRender(); });
window.addEventListener('offline', () => { if (D.tab==='ajustes') scheduleRender(); });

/* --- arranque --- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (CLOUD) startCloud();
else { render(); if (!D.setup) welcome(); }
</script>
